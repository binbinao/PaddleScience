# =============================================================================
# 3米工字梁有限元分析 - 配置文件
# =============================================================================

# 几何参数
geometry:
  beam_length: 3000.0       # 梁长 (mm)
  load_position: 1500.0     # 加载点位置 (mm), 跨中

# I25a 截面参数 (GB/T 706-2016)
section:
  name: "I25a"
  h: 252.0                  # 截面高度 (mm)
  b: 118.0                  # 翼缘宽度 (mm)
  t_w: 8.5                  # 腹板厚度 (mm)
  t_f: 13.7                 # 翼缘平均厚度 (mm)
  r: 10.0                   # 内圆弧半径 (mm)
  r1: 5.0                   # 腿端圆弧半径 (mm)
  A: 4853.0                 # 截面面积 (mm^2), 48.53 cm^2
  Ix: 50170000.0            # 强轴惯性矩 (mm^4), 5017 cm^4
  Iy: 2811000.0             # 弱轴惯性矩 (mm^4), 281.1 cm^4
  Wx: 398200.0              # 强轴截面模数 (mm^3), 398.2 cm^3
  Wy: 47650.0               # 弱轴截面模数 (mm^3), 47.65 cm^3

# Q235B 材料属性
material:
  name: "Q235B"
  E: 206000.0               # 弹性模量 (MPa), 206 GPa
  nu: 0.3                   # 泊松比
  rho: 7.85e-9              # 密度 (tonne/mm^3), 7850 kg/m^3
  G: 79230.77               # 剪切模量 (MPa), E/[2(1+nu)]
  sigma_y: 235.0            # 屈服强度 (MPa)

# 载荷工况
loads:
  P_min: 1000.0             # 最小载荷 (N)
  P_max: 5000.0             # 最大载荷 (N)
  P_step: 500.0             # 载荷步长 (N)

# 边界条件
boundary:
  left: "pin"               # 左端: 固定铰支座 (约束 u_y)
  right: "roller"           # 右端: 滚动支座 (约束 u_y)

# 有限元参数
fem:
  num_elements: 100         # 单元数目
  element_type: "euler_bernoulli"  # 梁单元类型

# 输出设置
output:
  dir: "outputs/fem_results"
  save_csv: true
  save_plots: true
  save_npz: true            # 保存numpy数据供后续PINN训练使用
