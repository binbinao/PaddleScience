defaults:
  - ppsci_default
  - TRAIN: train_default
  - TRAIN/ema: ema_default
  - TRAIN/swa: swa_default
  - EVAL: eval_default
  - INFER: infer_default
  - hydra/job/config/override_dirname/exclude_keys: exclude_keys_default
  - _self_

hydra:
  run:
    dir: outputs_deeponet/${now:%Y-%m-%d}/${now:%H-%M-%S}/${hydra.job.override_dirname}
  job:
    name: ${mode}
    chdir: false
  sweep:
    dir: ${hydra.run.dir}
    subdir: ./

# general settings
mode: train # running mode: train/eval/export/infer
seed: 2023
output_dir: ${hydra:run.dir}
log_freq: 20
use_tbd: true # TensorBoardX: train/eval loss, L2Rel, lr, throughput, histograms, pred figures

# replay historical train.log into TensorBoardX (python deeponet.py mode=plot_history)
HISTORY:
  log_path: ./outputs_deeponet
  tbd_dir: ./outputs_deeponet/tensorboard_history

# dataset files (generated from GRF if missing; official DeepXDE npz also works)
TRAIN_FILE_PATH: ./antiderivative_unaligned_train.npz
VALID_FILE_PATH: ./antiderivative_unaligned_test.npz

# paper Sec. 2.2 / 4.1.1: mean-zero GRF with RBF kernel, unaligned (u, y, G(u)(y))
DATA:
  length_scale: 0.2
  n_train: 10000
  n_test: 10000

# number of y points used when visualizing G(u)
NUM_Y: 1000

# Unstacked DeepONet + bias (paper Eq. 2, Table 2: branch depth 2 / trunk depth 3, width 40)
MODEL:
  u_key: "u"
  y_key: "y"
  G_key: "G"
  num_loc: 100
  num_features: 40
  branch_num_layers: 1
  trunk_num_layers: 2
  branch_hidden_size: 40
  trunk_hidden_size: 40
  branch_activation: relu
  trunk_activation: relu
  use_bias: true

# paper uses Adam lr=1e-3 and 50000 iterations for case 4.1.1
TRAIN:
  epochs: 10000
  iters_per_epoch: 1
  learning_rate: 1.0e-3
  save_freq: 500
  eval_freq: 500
  eval_during_train: true
  pretrained_model_path: null
  checkpoint_path: null

EVAL:
  pretrained_model_path: null
  eval_with_no_grad: true

INFER:
  pretrained_model_path: null
  export_path: ./inference/deeponet
  pdmodel_path: ${INFER.export_path}.pdmodel
  pdiparams_path: ${INFER.export_path}.pdiparams
  device: gpu
  engine: native
  precision: fp32
  onnx_path: ${INFER.export_path}.onnx
  ir_optim: true
  min_subgraph_size: 10
  gpu_mem: 4000
  gpu_id: 0
  max_batch_size: 128
  num_cpu_threads: 4
  batch_size: 128
