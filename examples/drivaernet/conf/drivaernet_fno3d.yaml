defaults:
  - ppsci_default
  - TRAIN: train_default
  - TRAIN/ema: ema_default
  - TRAIN/swa: swa_default
  - EVAL: eval_default
  - INFER: infer_default
  - hydra/job/config/override_dirname/exclude_keys: exclude_keys_default
  - _self_

hydra:
  run:
    dir: outputs_drivaernet_fno3d/${now:%Y-%m-%d}/${now:%H-%M-%S}/${hydra.job.override_dirname}
  job:
    name: ${mode}
    chdir: false
  callbacks:
    init_callback:
      _target_: ppsci.utils.callbacks.InitCallback
  sweep:
    dir: ${hydra.run.dir}
    subdir: ./

# general settings
mode: train
seed: 1
device: gpu
output_dir: ${hydra:run.dir}
log_freq: 20
use_tbd: true # TensorBoardX: train/eval loss, lr, throughput, histograms, Cd scatter

# FNO3D: voxel occupancy -> TFNO3d -> mean/max pool -> residual Cd
MODEL:
  arch: TFNO3D
  input_keys: ["occupancy"]
  output_keys: ["cd_value"]
  weight_keys: ["weight_keys"]
  occupancy_layout: voxels
  grid_size: 48
  n_modes_height: 12
  n_modes_width: 12
  n_modes_depth: 12
  in_channels: 1
  field_channels: 24
  hidden_channels: 24
  lifting_channels: 48
  projection_channels: 48
  n_layers: 4
  head_hidden: 128
  use_size_features: true
  norm: group_norm
  factorization: dense

# training settings
TRAIN:
  iters_per_epoch: -1
  num_points: 65536
  epochs: 80
  num_workers: 4
  eval_during_train: true
  eval_freq: 5
  save_freq: 10
  train_ids_file: "train_design_ids.txt"
  eval_ids_file: "val_design_ids.txt"
  batch_size: 4
  train_fractions: 1.0
  pretrained_model_path: null
  checkpoint_path: null

# evaluation settings
EVAL:
  num_points: 65536
  batch_size: 4
  pretrained_model_path: null
  eval_with_no_grad: true
  ids_file: "test_design_ids.txt"
  num_workers: 4

optimizer:
  weight_decay: 0.0001
  lr: 0.001
  eta_min: 1.0e-4
  warmup_epoch: 0

ARGS:
  dataset_path: "data/DrivAerNetPlusPlus_Processed_Point_Clouds_100k_paddle"
  aero_coeff: "data/AeroCoefficients_DrivAerNet_FilteredCorrected.csv"
  subset_dir: "data/subset_dir"
  data_url: "https://dataset.bj.bcebos.com/PaddleScience/DNNFluid-Car/DrivAer%2B%2B/data.tar"
