mode: train
output_dir: ${hydra:run.dir}
log_freq: 20
seed: 42
use_vdl: false
use_tbd: false
wandb_config: {}
use_wandb: false
device: null
use_amp: false
amp_level: O1
to_static: false
prim: false
log_level: info
trace: false
TRAIN:
  epochs: 40000
  iters_per_epoch: 1
  update_freq: 1
  save_freq: 0
  eval_during_train: true
  start_eval_epoch: 1
  eval_freq: 400
  checkpoint_path: null
  pretrained_model_path: null
  ema:
    use_ema: false
    decay: 0.9
    avg_freq: 1
  swa:
    use_swa: false
    avg_freq: 1
    avg_range: null
  learning_rate: 0.001
EVAL:
  pretrained_model_path: null
  eval_with_no_grad: false
  compute_metric_by_batch: false
  batch_size: 10240
INFER:
  pretrained_model_path: https://paddle-org.bj.bcebos.com/paddlescience/models/cylinder2d_unsteady_Re100/cylinder2d_unsteady_Re100_pretrained.pdparams
  export_path: ./inference/cylinder2d_unsteady_Re100
  pdmodel_path: ${INFER.export_path}.pdmodel
  pdiparams_path: ${INFER.export_path}.pdiparams
  onnx_path: ${INFER.export_path}.onnx
  device: gpu
  engine: native
  precision: fp32
  ir_optim: true
  min_subgraph_size: 5
  gpu_mem: 2000
  gpu_id: 0
  max_batch_size: 10240
  num_cpu_threads: 10
  batch_size: 10240
DOMAIN_TRAIN_PATH: ./datasets/domain_train.csv
DOMAIN_INLET_CYLINDER_PATH: ./datasets/domain_inlet_cylinder.csv
DOMAIN_OUTLET_PATH: ./datasets/domain_outlet.csv
IC0_1_PATH: ./datasets/initial/ic0.1.csv
PROBE1_50_PATH: ./datasets/probe/probe1_50.csv
DOMAIN_EVAL_PATH: ./datasets/domain_eval.csv
VISCOSITY: 0.02
DENSITY: 1.0
TIME_START: 1
TIME_END: 50
NUM_TIMESTAMPS: 50
TRAIN_NUM_TIMESTAMPS: 30
NPOINT_PDE: 9420
NPOINT_INLET_CYLINDER: 161
NPOINT_OUTLET: 81
MODEL:
  input_keys:
  - t
  - x
  - 'y'
  output_keys:
  - u
  - v
  - p
  num_layers: 5
  hidden_size: 50
  activation: tanh
